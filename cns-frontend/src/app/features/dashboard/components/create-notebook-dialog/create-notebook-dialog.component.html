<h2 mat-dialog-title>Create New Notebook</h2>

<form [formGroup]="notebookForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter notebook name" required>
      <mat-error *ngIf="notebookForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
      <mat-error *ngIf="notebookForm.get('name')?.hasError('maxlength')">
        Name cannot exceed 100 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" placeholder="Enter notebook description" rows="3"></textarea>
      <mat-error *ngIf="notebookForm.get('description')?.hasError('maxlength')">
        Description cannot exceed 500 characters
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="notebookForm.invalid">Create</button>
  </mat-dialog-actions>
</form>
